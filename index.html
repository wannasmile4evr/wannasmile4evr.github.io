<script>
// Preload whichever theme is actually cached as active (see themify.js's
// ws_theme_cache), instead of always warming up redux's images regardless
// of what the user actually last used. Falls back to redux's own images on
// a first-ever visit, when nothing has been cached yet.
(function () {
  var FALLBACK = [
    "https://wannasmile4evr.github.io./assets/media/themes/redux/headerBg.png",
    "https://wannasmile4evr.github.io./assets/media/themes/redux/quoteBg.png",
    "https://wannasmile4evr.github.io./assets/media/themes/redux/mainBg.png",
    "https://wannasmile4evr.github.io./assets/media/themes/redux/footerbg.png"
  ];

  function isPreloadableImage(v) {
    v = (v == null ? "" : String(v)).trim();
    return /^(https?:)?\/\//i.test(v) || v.indexOf("data:") === 0;
  }

  var urls = null;
  try {
    var activeId = (localStorage.getItem("selectedTheme") || "redux").trim().toLowerCase();
    var cache    = JSON.parse(localStorage.getItem("ws_theme_cache") || "{}");
    var row      = cache && typeof cache === "object" ? cache[activeId] : null;
    if (row) urls = [row[3], row[4], row[5], row[6]].filter(isPreloadableImage);
  } catch (_) { urls = null; }

  (urls && urls.length ? urls : FALLBACK).forEach(function (href) {
    var link = document.createElement("link");
    link.rel  = "preload";
    link.as   = "image";
    link.href = href;
    document.head.appendChild(link);
  });
})();

// Same idea for the active gif pack (see themify.js's ws_gifpack_cache) — the
// loader gif is the very first thing visible on load, so warm up whichever
// pack the user actually has active instead of always fetching redux's and
// letting it sit there until the real one swaps in.
(function () {
  var FALLBACK = ["assets/media/gifs/redux/loading.gif", "assets/media/gifs/redux/loaded.gif"];

  var urls = null;
  try {
    var activeId = (localStorage.getItem("ws_active_gifpack") || "redux").trim().toLowerCase();
    var cache    = JSON.parse(localStorage.getItem("ws_gifpack_cache") || "{}");
    var pack     = cache && typeof cache === "object" ? cache[activeId] : null;
    var states   = pack && pack.states ? pack.states : null;
    if (states) {
      urls = ["loading", "loaded"]
        .map(function (key) { return states[key] && states[key].src; })
        .filter(Boolean);
    }
  } catch (_) { urls = null; }

  (urls && urls.length ? urls : FALLBACK).forEach(function (href) {
    var link = document.createElement("link");
    link.rel  = "preload";
    link.as   = "image";
    link.href = href;
    document.head.appendChild(link);
  });
})();
</script>
